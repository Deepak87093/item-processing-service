services:
  postgres:
    image: postgres:16
    container_name: item-processing-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: item_processing
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d item_processing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: